name: Backend CI


on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.13
      - name: Install Dependencies
        run: uv sync --frozen
    
      - name: Run isort
        run: uv run isort --check src/
      - name: Run black
        run: uv run black --check src/
      - name: Run Tests
        run: PYTHONPATH=./src uv run pytest -v


  deploy:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ragchatbotacr2026

      - name: Build and push image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ragchatbotacr2026.azurecr.io/rag-backend:$IMAGE_TAG .
          docker push ragchatbotacr2026.azurecr.io/rag-backend:$IMAGE_TAG
      - name: Deploy to Container App
        run: |
          IMAGE_TAG=${{ github.sha }}
          az containerapp update \
            --name rag-backend-app \
            --resource-group Rag-Chatbot \
            --image ragchatbotacr2026.azurecr.io/rag-backend:$IMAGE_TAG

